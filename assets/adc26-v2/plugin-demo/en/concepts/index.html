<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'">
<meta name="theme-color" content="#07191f">
<title>GReggular Concepts</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="panel.css">
<script type="module" src="panel.js"></script>
</head>
<body>
  <canvas id="water" aria-hidden="true"></canvas>
  <div class="water-shade" aria-hidden="true"></div>
  <main class="app" id="app" data-caption-portal="true">
    <div id="connection" class="connection" role="status" aria-live="polite"><i></i><span>Connecting to engine…</span></div>
    <section id="scene" class="scene" aria-label="Centers and sound objects">
      <div id="scene-camera" class="scene-camera">
        <div id="centres" class="centres"></div>
        <div id="loose" class="loose-sounds" aria-label="Sounds without an emitter"></div>
      </div>
      <div id="empty" class="empty-state" hidden><span aria-hidden="true">◌</span><h1>Centers</h1><p>Clouds · shared parameters</p><button type="button" class="primary-button" data-action="first-centre" aria-label="Create center" title="Create center">＋</button></div>
      <div id="inactive" class="inactive-state" hidden><span aria-hidden="true">◉</span><h1>Concepts</h1><p>◌ · ◌ · ◌</p><button type="button" class="primary-button" data-action="activate" aria-label="Activate Concepts" title="Enable">⏻</button></div>
      <aside id="inspector" class="inspector" aria-live="polite" hidden></aside>
    </section>
    <section id="creation" class="creation" aria-label="New sound objects">
      <div id="shelf-heading" class="shelf-heading"><div><span class="eyebrow">◌</span><h2 aria-label="New objects">Objects</h2></div><span id="shelf-count" class="shelf-count">0</span><button type="button" id="import-objects" class="quiet-link" aria-label="Import objects" title="Import" hidden>⇩</button><span id="demo-label" class="demo-label" hidden>Sample data</span></div>
      <p id="import-status" class="import-status" role="status" aria-live="polite" hidden></p>
      <div id="object-rail" class="object-rail" aria-label="Objects and suggestions">
        <div id="shelf" class="shelf" aria-label="Unassigned objects"></div>
        <div id="suggestions" class="sound-suggestions" aria-label="Suggestions for more sounds"></div>
      </div>
      <p id="generation-note" class="generation-note" role="status" hidden></p>
      <div id="generation-job" class="generation-job" hidden><span id="generation-job-label" role="status" aria-live="polite"></span><div><button type="button" class="quiet-link" data-action="generate-pending" aria-label="Generate object" title="Wygeneruj">↻</button><button type="button" class="quiet-link" data-action="cancel-generation" aria-label="Cancel" title="Cancel">×</button></div></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
    <footer class="topbar bottom-bar" aria-label="Concepts main bar">
      <a class="brand" href="../premiere/?demo=1" aria-label="Greggular — web mode"><span class="brand-mark" aria-hidden="true">≈</span><span><span style="opacity:.42">G</span>Reggular <b>Concepts</b></span></a>
      <form id="generator" class="generator">
        <label class="sr-only" for="prompt">Describe a new sound object</label>
        <span class="prompt-mark" aria-hidden="true">♫</span>
        <textarea id="prompt" rows="1" maxlength="500" placeholder="Sound…" aria-label="Describe a new sound object" required></textarea>
        <button id="generate" type="submit" class="primary-button" aria-label="Generate sound" title="Generate" disabled>↗</button>
      </form>
      <div class="top-actions">
        <button type="button" id="library-toggle" class="icon-button" aria-label="Library and presets" aria-controls="library-drawer" aria-expanded="false"><span aria-hidden="true">▱</span></button>
        <details id="concepts-settings" class="concepts-settings"><summary aria-label="Concepts settings" title="Settings">⚙</summary><div class="settings-options"><label><input id="concepts-cards" type="checkbox"> Sound cards</label><label><input id="concepts-motion" type="checkbox" checked> Floating motion</label><button type="button" class="quiet-link" data-action="reset-layout" aria-label="Reset center and sound layout" title="Reset layout">↺</button></div></details>
        <button type="button" id="add-centre" class="subtle-button" aria-label="Add center" title="Add center" disabled>＋</button>
      </div>
    </footer>
    <div class="concepts-floating-controls" aria-label="Playback and power">
      <button type="button" id="master-transport" class="icon-button" aria-label="Start transport" title="Transport" disabled><span aria-hidden="true">▶</span></button>
      <button type="button" id="deactivate-concepts" class="icon-button" aria-label="Deactivate Concepts" title="Disable" hidden><span aria-hidden="true">⏻</span></button>
    </div>
    <aside id="library-drawer" class="library-drawer" aria-label="Library and presets" hidden>
      <header class="library-heading">
        <div class="library-tabs" role="tablist" aria-label="Library">
          <button type="button" id="library-presets-tab" role="tab" aria-selected="true" aria-controls="library-presets">Presets</button>
          <button type="button" id="library-samples-tab" role="tab" aria-selected="false" aria-controls="library-samples" tabindex="-1">Sample</button>
        </div>
        <select id="library-target" aria-label="Preset scope and center for samples"><option value="">◌ Scene</option></select>
        <button type="button" id="library-close" class="library-icon" aria-label="Close library">×</button>
      </header>
      <section id="library-presets" role="tabpanel" aria-labelledby="library-presets-tab">
        <form id="library-save-form" class="library-tools">
          <input id="library-preset-name" aria-label="Preset name" placeholder="Preset name…" maxlength="80" required>
          <button type="submit" id="library-save" class="library-icon" aria-label="Save preset">▣</button>
          <button type="button" id="library-load" class="library-icon" aria-label="Load preset from file">↥</button>
        </form>
        <div id="library-preset-list" class="library-grid" aria-label="Presets"></div>
      </section>
      <section id="library-samples" role="tabpanel" aria-labelledby="library-samples-tab" hidden>
        <div class="library-tools library-import-tools">
          <button type="button" id="library-files" class="library-icon" aria-label="Add audio files to library">♫</button>
          <button type="button" id="library-folder" class="library-icon" aria-label="Add sample folder to library">▱</button>
          <button type="button" id="library-native-folder" class="library-icon" aria-label="Import WAV folder into engine" hidden>⇩</button>
          <span id="library-sample-count" class="library-count"></span>
        </div>
        <div id="library-sample-list" class="library-grid" aria-label="Your samples"></div>
      </section>
      <progress id="library-progress" max="1" value="0" aria-label="Library operation progress" hidden></progress>
      <p id="library-note" class="library-note" role="status" aria-live="polite" hidden></p>
      <input id="library-audio-input" type="file" accept=".wav,.aif,.aiff,.flac,.ogg,.mp3" multiple hidden>
      <input id="library-folder-input" type="file" accept=".wav,.aif,.aiff,.flac,.ogg,.mp3" webkitdirectory directory multiple hidden>
      <input id="library-preset-input" type="file" accept=".json,.greggular.json" multiple hidden>
    </aside>
    <div id="library-drop-overlay" class="library-drop-overlay" aria-hidden="true" hidden><span>＋</span><small id="library-drop-label"></small></div>
    <div id="sound-focus" class="sound-focus" hidden></div>
    <div id="control-caption" class="control-caption" aria-hidden="true" hidden></div>
    <dialog id="centre-dialog" class="concepts-dialog"><form id="centre-form" method="dialog"><h2>New center</h2><label for="centre-name-input">Center name</label><input id="centre-name-input" maxlength="60" value="α" required><div class="dialog-actions"><button type="button" class="quiet-link" data-action="dismiss-centre-dialog">Cancel</button><button type="submit" class="primary-button">Create center</button></div></form></dialog>
    <dialog id="delete-dialog" class="concepts-dialog"><form id="delete-form" method="dialog"><h2>Delete center?</h2><p id="delete-copy"></p><div class="dialog-actions"><button type="button" class="quiet-link" data-action="dismiss-delete-dialog">Cancel</button><button type="submit" class="primary-button">Delete center</button></div></form></dialog>
  </main>
</body>
</html>
